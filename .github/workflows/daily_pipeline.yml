name: Daily Pipeline

on:
  # schedule:
  #   # 10:30 UTC = 18:30 CST, well after Chinese A-share market closes (15:00 CST)
  #   # Extra buffer ensures EOD data is published by data providers
  #   # Runs Mon–Fri only
  #   - cron: "30 10 * * 1-5"
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.10"
          environment-file: environment.yml
          activate-environment: gold-finger
          auto-activate-base: false

      - name: Install pip dependencies
        shell: bash -el {0}
        run: pip install -r requirements.txt

      - name: Restore cached models
        uses: actions/cache@v4
        with:
          path: models/
          key: pipeline-models-601933-${{ github.run_id }}
          restore-keys: |
            pipeline-models-601933-

      - name: Run daily pipeline
        shell: bash -el {0}
        run: |
          python daily_pipeline.py --ticker 601933 --predict-only 2>&1 | tee pipeline_output.txt

      - name: Upload pipeline output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-output-601933-${{ github.run_id }}
          path: pipeline_output.txt
          retention-days: 30

      - name: Send results to Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 - <<'EOF'
          import json, os, re, urllib.request

          webhook = os.environ.get("SLACK_WEBHOOK_URL", "")
          if not webhook:
              print("SLACK_WEBHOOK_URL not set, skipping")
              exit(0)

          ticker = "601933"
          run_url = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          try:
              text = open("pipeline_output.txt").read()
          except FileNotFoundError:
              text = ""

          def find(pattern, default="N/A"):
              m = re.search(pattern, text)
              return m.group(1).strip() if m else default

          date     = find(r"Latest data: (\d{4}-\d{2}-\d{2})")
          close    = find(r"close=([\d.]+)")
          signal   = find(r"Today's signal: (.+)")
          accuracy = find(r"Overall accuracy:\s+([\d.]+%)")
          roll_acc = find(r"Rolling 20d accuracy:\s+([\d.]+%)")
          retrain  = find(r"Needs retrain:\s+(\w+)")
          pred_low  = find(r"Pred low\s+:\s+([\d.]+)")
          pred_high = find(r"Pred high\s+:\s+([\d.]+)")

          from datetime import date as _date
          today = _date.today().strftime("%m-%d")

          emoji = {"BUY": ":green_circle:", "SELL": ":red_circle:"}.get(signal, ":white_circle:")
          status = ":warning: *Model needs retraining!*" if retrain == "YES" else ":white_check_mark: Model OK"
          range_line = f":dart: *{today} range: {pred_low} – {pred_high}*\n" if pred_low != "N/A" else ""

          msg = (
              f"*{ticker} Daily Prediction*\n"
              f"\n"
              f"{emoji} Signal: *{signal}*\n"
              f":bar_chart: Accuracy: *{accuracy}* (20d: *{roll_acc}*)\n"
              f"{range_line}"
              f"{status}\n"
              f"_From data by {date}  |  close: {close}_\n"
              f"<{run_url}|View full output>"
          )

          payload = json.dumps({"text": msg}).encode()
          req = urllib.request.Request(webhook, data=payload,
                                       headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req)
          print("Slack notification sent")
          EOF
